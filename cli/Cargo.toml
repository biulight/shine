[package]
name = "cli"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "shine"
path = "src/main.rs"

[dependencies]
utils = { path = "../utils" }
anyhow = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
console = "0.16.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
directories = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "fs", "process", "sync"] }
toml = { workspace = true }
toml_edit = { workspace = true }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
owo-colors = { version = "4", features = ["supports-colors"] }
similar = "3.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "socks"] }
semver = "1.0.28"
serde_json = "1.0.145"
jsonc-parser = { version = "0.32.3", features = ["serde"] }
flate2 = "1.1.4"
tar = "0.4.44"
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
sha2 = "0.10.9"
