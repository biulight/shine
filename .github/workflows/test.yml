name: test

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust and Bun with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.7
      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Check Bun TypeScript sources
        run: bun run check:ts
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Check code format
        run: cargo fmt -- --check
      - name: Check the package for errors
        run: cargo check --all
      - name: Verify Preset authoring example
        run: |
          cargo run -- preset validate examples/presets --format json
          cargo run -- preset lint examples/presets --format json --deny-warnings
          cargo run -- preset test examples/presets/app/demo --format json
          cargo run -- preset pack examples/presets/app/demo --output target/demo.shine-preset.tar.gz --format json
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Security audit
        run: cargo audit

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.7
          install_args: rust
      - name: Install Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Execute rust tests
        run: cargo nextest run --all-features --target ${{ matrix.target }}
