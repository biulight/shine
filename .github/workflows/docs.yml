name: docs

on:
  pull_request:
    branches:
      - release
      - main
    paths:
      - docs/manual/**
      - website/**
      - .github/workflows/docs.yml
  push:
    branches:
      - release
    paths:
      - docs/manual/**
      - website/**
      - .github/workflows/docs.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install documentation dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Type-check documentation site
        working-directory: website
        run: pnpm typecheck
      - name: Check locale content parity
        working-directory: website
        run: pnpm check:locales
      - name: Build all locales
        working-directory: website
        run: pnpm build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build
      - name: Upload server deployment artifact
        if: github.event_name != 'pull_request' && vars.SERVER_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-server
          path: website/build
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    if: github.event_name != 'pull_request' && vars.SERVER_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs-server
      url: ${{ vars.SERVER_URL }}
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_PATH: ${{ vars.SERVER_PATH }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
    steps:
      - name: Download server deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-server
          path: website-build
      - name: Validate server deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_PATH SERVER_SSH_KEY SERVER_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing docs-server configuration: ${name}"
              exit 1
            fi
          done
          if [[ ! "$SERVER_PORT" =~ ^[0-9]+$ ]] || (( SERVER_PORT < 1 || SERVER_PORT > 65535 )); then
            echo "::error::SERVER_PORT must be an integer between 1 and 65535"
            exit 1
          fi
          if [[ "$SERVER_PATH" == "/" || ! "$SERVER_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::SERVER_PATH must be a safe absolute path other than /"
            exit 1
          fi
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/docs-server
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/docs-server ~/.ssh/known_hosts
      - name: Deploy to server
        shell: bash
        run: |
          set -euo pipefail
          rsync \
            --archive \
            --compress \
            --delete-delay \
            --human-readable \
            --itemize-changes \
            -e "ssh -p $SERVER_PORT -i $HOME/.ssh/docs-server -o IdentitiesOnly=yes" \
            website-build/ \
            "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"
