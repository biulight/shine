name: release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  msrv:
    uses: ./.github/workflows/msrv.yml

  build-release-assets:
    needs:
      - test
      - msrv
    uses: ./.github/workflows/package-assets.yml

  publish-crates:
    needs:
      - test
      - msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.7
          install_args: rust
      - name: Publish shine-core
        run: cargo publish --locked -p shine-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish shine-cli
        shell: bash
        run: |
          for _ in {1..12}; do
            cargo publish --locked -p shine-cli && exit 0
            sleep 10
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs:
      - test
      - msrv
      - build-release-assets
      - publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Prepare release files
        run: |
          chmod +x install.sh
          find dist -type f -name 'shine-v*.tar.gz' -print
      - name: Select release notes range
        id: release-notes-range
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "range=--latest" >> "$GITHUB_OUTPUT"
            echo "tag_filter=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_stable=""
          while IFS= read -r tag; do
            [[ "$tag" == "$GITHUB_REF_NAME" ]] && continue
            [[ "$tag" == *-* ]] && continue
            previous_stable="$tag"
            break
          done < <(git tag --list 'v[0-9]*' --sort=-version:refname)

          if [[ -z "$previous_stable" ]]; then
            echo "::error::No previous stable v* tag found for $GITHUB_REF_NAME"
            exit 1
          fi

          echo "range=${previous_stable}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_filter=--ignore-tags=^v[0-9].*-rc[.][0-9]+$" >> "$GITHUB_OUTPUT"
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv ${{ steps.release-notes-range.outputs.range }} ${{ steps.release-notes-range.outputs.tag_filter }} --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/**/*.tar.gz
            install.sh
            install.ps1

  verify-binstall:
    needs:
      - release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_binary: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            run_binary: false
          - runner: macos-14
            target: aarch64-apple-darwin
            run_binary: true
          - runner: macos-14
            target: x86_64-apple-darwin
            run_binary: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            run_binary: true
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            run_binary: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.7
          install_args: rust
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall@1.12.7
          fallback: none
      - name: Verify published crate metadata and release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          BINSTALL_TARGET: ${{ matrix.target }}
        run: |
          mise exec -- cargo binstall shine-cli --version "=${RELEASE_TAG#v}" \
            --target "$BINSTALL_TARGET" --strategies crate-meta-data \
            --root "$RUNNER_TEMP/binstall-$BINSTALL_TARGET" --dry-run --no-confirm
      - name: Install and run native release binary
        if: matrix.run_binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          BINSTALL_TARGET: ${{ matrix.target }}
        run: |
          version="${RELEASE_TAG#v}"
          install_root="$RUNNER_TEMP/binstall-$BINSTALL_TARGET"
          mise exec -- cargo binstall shine-cli --version "=$version" \
            --target "$BINSTALL_TARGET" --strategies crate-meta-data \
            --root "$install_root" --no-confirm
          binary="$install_root/bin/shine"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          actual="$(SHINE_CONFIG_DIR="$RUNNER_TEMP/shine-binstall-config" "$binary" --version)"
          actual="${actual//$'\r'/}"
          echo "$actual"
          read -r name installed_version _ <<< "$actual"
          [[ "$name" == "shine" && "$installed_version" == "$version" ]]

  open-main-pr:
    if: ${{ !contains(github.ref_name, '-') }}
    needs:
      - verify-binstall
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "release";
            const base = "main";

            const { data: existingPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            if (existingPulls.length > 0) {
              core.info(`Open PR already exists: #${existingPulls[0].number}`);
              return;
            }

            const tag = context.ref.replace("refs/tags/", "");
            const title = `chore(release): merge ${tag} into main`;
            const body = [
              "Automated release sync PR.",
              "",
              `- Source branch: \`${head}\``,
              `- Target branch: \`${base}\``,
              `- Release tag: \`${tag}\``,
            ].join("\n");

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              core.info(`Created PR #${pr.number}`);
            } catch (err) {
              core.warning(
                `Could not create release PR automatically: ${err.message}\n` +
                `To fix, go to Settings → Actions → General and enable ` +
                `"Allow GitHub Actions to create and approve pull requests", ` +
                `then open the PR manually: ` +
                `https://github.com/${owner}/${repo}/compare/${base}...${head}`
              );
            }
