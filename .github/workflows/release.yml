name: release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-release-assets:
    needs: test
    uses: ./.github/workflows/package-assets.yml

  publish-crates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust with mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.7
          install_args: rust
      - name: Publish shine-core
        run: cargo publish --locked -p shine-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish shine-cli
        shell: bash
        run: |
          for attempt in {1..12}; do
            cargo publish --locked -p shine-cli && exit 0
            sleep 10
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs:
      - test
      - build-release-assets
      - publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Prepare release files
        run: |
          chmod +x install.sh
          find dist -type f -name 'shine-v*.tar.gz' -print
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/**/*.tar.gz
            install.sh
            install.ps1

  open-main-pr:
    needs:
      - release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "release";
            const base = "main";

            const { data: existingPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            if (existingPulls.length > 0) {
              core.info(`Open PR already exists: #${existingPulls[0].number}`);
              return;
            }

            const tag = context.ref.replace("refs/tags/", "");
            const title = `chore(release): merge ${tag} into main`;
            const body = [
              "Automated release sync PR.",
              "",
              `- Source branch: \`${head}\``,
              `- Target branch: \`${base}\``,
              `- Release tag: \`${tag}\``,
            ].join("\n");

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              core.info(`Created PR #${pr.number}`);
            } catch (err) {
              core.warning(
                `Could not create release PR automatically: ${err.message}\n` +
                `To fix, go to Settings → Actions → General and enable ` +
                `"Allow GitHub Actions to create and approve pull requests", ` +
                `then open the PR manually: ` +
                `https://github.com/${owner}/${repo}/compare/${base}...${head}`
              );
            }
