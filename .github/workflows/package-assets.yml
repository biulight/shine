name: package assets

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_target: linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_target: linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            asset_target: darwin-aarch64
          - runner: macos-14
            target: x86_64-apple-darwin
            asset_target: darwin-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_target: windows-x86_64
            binary_name: shine.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            asset_target: windows-aarch64
            binary_name: shine.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = "branch" ]; then
            export SHINE_VERSION_METADATA="preview.${GITHUB_SHA::7}"
          fi
          cargo build --release -p cli --target ${{ matrix.target }}
      - name: Package archive
        env:
          ASSET_TARGET: ${{ matrix.asset_target }}
          BINARY_NAME: ${{ matrix.binary_name || 'shine' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "dist/${BINARY_NAME}"
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            ARCHIVE="shine-v${VERSION}-${ASSET_TARGET}.tar.gz"
          else
            ARCHIVE="shine-preview-${ASSET_TARGET}.tar.gz"
          fi
          tar -czf "dist/${ARCHIVE}" -C dist "${BINARY_NAME}"
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_target }}
          path: dist/*.tar.gz
