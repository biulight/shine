name: package assets

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the userspace baseline independent of the hosted runner image.
          - runner: ubuntu-latest
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            asset_target: linux-x86_64
          - runner: ubuntu-latest
            container: ubuntu:22.04
            target: aarch64-unknown-linux-gnu
            asset_target: linux-aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_target: darwin-aarch64
          - runner: macos-15
            target: x86_64-apple-darwin
            asset_target: darwin-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_target: windows-x86_64
            binary_name: shine.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            asset_target: windows-aarch64
            binary_name: shine.exe
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates \
            curl git python3 xz-utils zstd pkg-config cmake
      - uses: actions/checkout@v7
      - name: Install Rust with mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          install_args: rust
      - name: Install Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}
      - name: Install Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore objects compiled against the former runner's newer libc.
          key: ${{ matrix.target }}-${{ matrix.container || matrix.runner }}
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = "branch" ]; then
            export SHINE_VERSION_METADATA="preview"
            export SHINE_GIT_SHA="$GITHUB_SHA"
          fi
          cargo build --locked --release -p shine-cli --target ${{ matrix.target }}
      - name: Package archive
        env:
          ASSET_TARGET: ${{ matrix.asset_target }}
          BINARY_NAME: ${{ matrix.binary_name || 'shine' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "dist/${BINARY_NAME}"
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            ARCHIVE="shine-v${VERSION}-${ASSET_TARGET}.tar.gz"
          else
            ARCHIVE="shine-preview-${ASSET_TARGET}.tar.gz"
          fi
          tar -czf "dist/${ARCHIVE}" -C dist "${BINARY_NAME}"
      - name: Verify Linux archive on Ubuntu 22.04
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          check_root=$(mktemp -d)
          trap 'rm -rf "$check_root"' EXIT
          tar -xzf dist/*.tar.gz -C "$check_root"
          python3 scripts/check-linux-glibc.py "$check_root/shine"
          command=("$check_root/shine")
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            command=(qemu-aarch64 -L /usr/aarch64-linux-gnu "$check_root/shine")
          fi
          export SHINE_CONFIG_DIR="$check_root/config"
          timeout 60 "${command[@]}" --version
          timeout 60 "${command[@]}" --help > /dev/null
          timeout 60 "${command[@]}" preset schema --format json > "$check_root/schema.json"
          python3 -m json.tool "$check_root/schema.json" > /dev/null
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_target }}
          path: dist/*.tar.gz
