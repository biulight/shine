name: build

on:
  push:
    branches:
      - release
    tags:
      - v*
  pull_request:
    branches:
      - release
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Check code format
        run: cargo fmt -- --check
      - name: Check the package for errors
        run: cargo check --all
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --all-features

  build-release-assets:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/')
    needs: test
    uses: ./.github/workflows/package-assets.yml

  preview-release:
    if: github.ref == 'refs/heads/release'
    needs:
      - test
      - build-release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update preview tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa preview "$GITHUB_SHA" -m "Preview $GITHUB_SHA"
          git push --force origin refs/tags/preview
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Prepare preview release files
        run: |
          cat > PREVIEW_BODY.md <<EOF
          Automated preview build from the release branch.

          - Source branch: \`release\`
          - Commit: \`${GITHUB_SHA}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease is overwritten on every push to the release branch.
          EOF
          find dist -type f -name 'shine-preview-*.tar.gz' -print
      - name: Delete existing preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete preview --repo "$GITHUB_REPOSITORY" --yes || true
      - name: Publish preview release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          name: Preview
          body_path: PREVIEW_BODY.md
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/**/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test
      - build-release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Prepare release files
        run: |
          chmod +x install.sh
          find dist -type f -name 'shine-v*.tar.gz' -print
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/**/*.tar.gz
            install.sh

  open-main-pr:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "release";
            const base = "main";

            const { data: existingPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            if (existingPulls.length > 0) {
              core.info(`Open PR already exists: #${existingPulls[0].number}`);
              return;
            }

            const tag = context.ref.replace("refs/tags/", "");
            const title = `chore(release): merge ${tag} into main`;
            const body = [
              "Automated release sync PR.",
              "",
              `- Source branch: \`${head}\``,
              `- Target branch: \`${base}\``,
              `- Release tag: \`${tag}\``,
            ].join("\n");

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              core.info(`Created PR #${pr.number}`);
            } catch (err) {
              core.warning(
                `Could not create release PR automatically: ${err.message}\n` +
                `To fix, go to Settings → Actions → General and enable ` +
                `"Allow GitHub Actions to create and approve pull requests", ` +
                `then open the PR manually: ` +
                `https://github.com/${owner}/${repo}/compare/${base}...${head}`
              );
            }
