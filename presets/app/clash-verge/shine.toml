description = "Clash Verge Rev subscription enhancements: layers a LAN proxy, policy groups, and rule-providers onto the active subscription without touching it."
dest = "~/.shine/clash-verge"
list_mode = "files"

# `shine app artifact apply clash-verge` runs the artifact script to refresh the mihomo
# rule-providers via the external controller — the analog of `surge-cli reload`.
# HTTP providers re-pull their source; file providers reload their local file.
# After every provider refresh succeeds, the artifact closes current mihomo
# connections so long-lived browser sessions reconnect under the new rules.
# `teardown` (via
# `shine app artifact remove clash-verge`, and best-effort on `shine app uninstall`)
# just prints how to clear the subscription enhancements in CVR, since CVR owns
# those bindings in its private store and shine never writes them.
#
# runtime = "bun" runs the scripts via `bun <script>`, so — unlike surge's
# macOS-only bash artifact — clash-verge's artifact works on macOS/Windows/Linux
# (CVR is cross-platform). bun is an external prerequisite (https://bun.sh).
#
# The real logic (rendering the active subscription's four bound enhancement
# files + refreshing rule-providers) lives in the artifact because only it receives its explicit
# `[artifact].env` allowlist and SHINE_APP_OVERLAY_DIR. The hooks below do NOT run that logic directly — they
# re-invoke `shine app artifact apply clash-verge` so it runs automatically after
# `shine app install`/`shine upgrade` changes merge.yaml. (No recursion: build
# fires neither install nor upgrade hooks.) Requires `shine` on PATH; external
# presets need allow_app_hooks = true. The built-in local rule references below
# are ordinary managed files, so their updates trigger the same hook and
# provider refresh as merge.yaml updates.
post_install = [
  { command = "shine", args = ["app", "artifact", "apply", "clash-verge", "--yes"], show_output = true },
]
post_upgrade = [
  { command = "shine", args = ["app", "artifact", "apply", "clash-verge", "--yes"], show_output = true },
]

[artifact]
script = "build.ts"
teardown = "unbuild.ts"
runtime = "bun"
env = ["CLASH_PROFILES_FILE", "CLASH_CONTROLLER_URL", "CLASH_CONTROLLER_TOKEN"]

[permissions]
schema_version = 1
filesystem = [
  { access = ["execute"], base = "preset", path = "build.ts" },
  { access = ["execute"], base = "preset", path = "unbuild.ts" },
]
network = [{ scope = "any" }]
commands = ["bun", "shine"]
environment = [
  { name = "CLASH_PROFILES_FILE", sensitivity = "plain" },
  { name = "CLASH_CONTROLLER_URL", sensitivity = "plain" },
  { name = "CLASH_CONTROLLER_TOKEN", sensitivity = "secret" },
]

# The single composite enhancement payload, installed verbatim (plain Copy — no
# templating, so the file is always valid YAML). build.ts splits its keys into
# CVR's bound Merge / Rules / Proxies / Groups files. The copy shipped here is
# an inert, commented EXAMPLE (empty by default) — put your real values in a presets overlay under the same
# name (`app/clash-verge/merge.yaml`), hardcoded directly, exactly like the Surge
# preset's `local-*.conf`. Open the four enhancement editors on the active
# subscription once; build.ts resolves those bindings through CVR's profiles.yaml
# without modifying it. Rule content thereafter auto-refreshes via the providers.
[[files]]
source = "merge.yaml"
target = "merge.yaml"
description = "CVR subscription enhancements (proxies + proxy-groups + file/loopback/remote rule-provider examples + prepend-rules), rendered into the active profile's four bound editor files."

# Local `type: file` provider references. `data-dir` resolves to the platform's
# application data directory (%APPDATA%, Application Support, or XDG data),
# which is CVR's default mihomo HomeDir. HTTP/HTTPS providers do not reference
# these files, so installing them does not change Option 2 or Option 3 behavior.
[[files]]
source = "rules/lan.list"
target = "ruleset/shine-source/lan.list"
dest = { base = "data-dir", path = "io.github.clash-verge-rev.clash-verge-rev" }
description = "Reference local/private-network rules for the Option 1 file provider."

[[files]]
source = "rules/lan-socks.list"
target = "ruleset/shine-source/lan-socks.list"
dest = { base = "data-dir", path = "io.github.clash-verge-rev.clash-verge-rev" }
description = "Reference rules for traffic that should prefer a LAN SOCKS exit."

[[files]]
source = "rules/other-direct.list"
target = "ruleset/shine-source/other-direct.list"
dest = { base = "data-dir", path = "io.github.clash-verge-rev.clash-verge-rev" }
description = "Reference rules for destinations that should default to direct routing."
