# Clash Verge Rev — local "Merge" (Extend Config) profile. EXAMPLE / empty by default.
#
# This is a safe, inert example. Everything below is commented out, so installing
# it changes nothing. Override it from a presets overlay (same filename,
# `app/clash-verge/merge.yaml`) with your real values, hardcoded directly — exactly
# how the Surge preset ships empty `local-*.conf` examples here and the real ones in
# the overlay. It is installed verbatim (no templating), so it is always valid YAML.
#
# What a real merge looks like (uncomment + adapt in your overlay):
#
# # A LAN SOCKS exit (mihomo analog of Surge `LAN-SOCKS = socks5, <host>, <port>`).
# proxies:
#   - name: LAN-SOCKS
#     type: socks5
#     server: 10.0.0.2
#     port: 7897
#
# # Selector groups; `include-all: true` == Surge `include-all-proxies=true`.
# proxy-groups:
#   - { name: Local Network,   type: select, include-all: true, proxies: [DIRECT] }
#   - { name: LAN SOCKS Rules, type: select, include-all: true, proxies: [LAN-SOCKS, DIRECT] }
#   - { name: Other Direct,    type: select, include-all: true, proxies: [DIRECT] }
#
# # Remote rule-providers — mihomo analog of Surge's remote RULE-SET URLs. Point
# # them at the SAME LAN server `shine task run upload_surge` publishes to, so
# # Surge and CVR share one rule source. `behavior: classical, format: text`
# # consumes the Surge `.list` syntax (incl. `IP-CIDR,...,no-resolve`) directly.
# rule-providers:
#   lan:          { type: http, behavior: classical, format: text, interval: 86400, url: https://example.internal/surge/rules/lan.list,          path: ./ruleset/shine-lan.list }
#   lan-socks:    { type: http, behavior: classical, format: text, interval: 86400, url: https://example.internal/surge/rules/lan-socks.list,    path: ./ruleset/shine-lan-socks.list }
#   other-direct: { type: http, behavior: classical, format: text, interval: 86400, url: https://example.internal/surge/rules/other-direct.list, path: ./ruleset/shine-other-direct.list }
#
# # `prepend-rules` (CVR's real Merge key — NOT a generic `prepend:` list) puts
# # local rules ahead of the subscription's, so they win first-match.
# prepend-rules:
#   - RULE-SET,lan,Local Network
#   - RULE-SET,lan-socks,LAN SOCKS Rules
#   - RULE-SET,other-direct,Other Direct
