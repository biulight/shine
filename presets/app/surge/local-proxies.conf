# Local proxy definitions merged into the active Surge profile's [Proxy] section.
#
# `shine app install surge` copies this file next to your profile; the overlay's
# build.sh appends `, local-proxies.conf` to the [Proxy] `#!include` line so
# Surge loads these alongside the provider proxies. Keep it empty by default and
# override it from a presets overlay when you need a local exit.
#
# Example:
[Proxy]
# LAN-SOCKS = socks5, 10.43.133.121, 7897
