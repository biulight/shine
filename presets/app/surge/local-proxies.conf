# Local proxy definitions merged into the active Surge profile's [Proxy] section.
#
# `shine app install surge` copies this file next to your profile; the built-in
# build.ts appends `, local-proxies.conf` to the [Proxy] `#!include` line so
# Surge loads these alongside the provider proxies. Keep it empty by default and
# override it from a presets overlay when you need a local exit.
#
# Example (replace the documentation-only address and port before enabling):
[Proxy]
# LAN-SOCKS = socks5, 192.0.2.10, 1080
