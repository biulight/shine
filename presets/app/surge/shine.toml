description = "Surge local proxy/rule files, installed beside the active profile."
dest = { macos = "~/Library/Application Support/Surge/Profiles" }
list_mode = "files"
post_upgrade = [
  { command = "/Applications/Surge.app/Contents/Applications/surge-cli", args = ["reload"] },
]
# Mirror post_upgrade so the very first `shine app install surge` also reloads
# Surge (post_upgrade only fires on `shine upgrade`).
post_install = [
  { command = "/Applications/Surge.app/Contents/Applications/surge-cli", args = ["reload"] },
]

# `shine app artifact apply surge` runs the artifact script to patch the active profile's
# per-section `#!include` lines so they also include the local files installed
# here. `teardown` (via `shine app artifact remove surge`, and best-effort on
# `shine app uninstall surge`) reverses that patch. The implementation is
# generic; overlays provide only their local policy files and profile path.
[artifact]
script = "build.ts"
teardown = "unbuild.ts"
runtime = "bun"

[[files]]
source = "local-proxies.conf"
target = "local-proxies.conf"
description = "Local proxy definitions (e.g. a LAN SOCKS exit) merged into [Proxy]."

[[files]]
source = "local-rules.conf"
target = "local-rules.conf"
description = "Local priority rules merged into [Rule] ahead of provider rules."

[[files]]
source = "rules/lan.list"
target = "rules/lan.list"
description = "Example local/private-network rules for the LAN Network group."

[[files]]
source = "rules/lan-socks.list"
target = "rules/lan-socks.list"
description = "Example rules for traffic that should prefer a LAN SOCKS exit."

[[files]]
source = "rules/other-direct.list"
target = "rules/other-direct.list"
description = "Example rules for destinations that should default to direct routing."

[[files]]
source = "local-proxy-groups.conf"
target = "local-proxy-groups.conf"
description = "Local proxy groups merged into [Proxy Group] after provider groups."

[[files]]
source = "subscription-proxies.conf"
target = "subscription-proxies.conf"
description = "SS/VMess policies generated from SURGE_SUBSCRIPTION_URL."
generator = { script = "generate-subscription.ts", runtime = "bun", env = ["SURGE_SUBSCRIPTION_URL"], when_env = "SURGE_SUBSCRIPTION_URL", auto = false }
