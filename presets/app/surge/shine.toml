description = "Surge module rules managed by shine."
dest = "~/.shine/http/app/surge"
list_mode = "files"
post_upgrade = [
  { command = "/Applications/Surge.app/Contents/Applications/surge-cli", args = ["reload"] },
  { command = "/bin/echo", args = ["note: Surge caches Modules added by URL, so reload may not pick up the change immediately. If the new rules don't take effect, manually re-import/update the module in Surge."], show_output = true },
]

[[files]]
source = "custom-rules.sgmodule"
target = "custom-rules.sgmodule"
description = "Custom Surge rules module."
