# Local priority rules merged into the active Surge profile's [Rule] section.
#
# `shine app install surge` copies this file and the example lists under
# `rules/` next to your profile. The built-in build.ts prepends
# `local-rules.conf` to the [Rule] `#!include` line so enabled entries run ahead
# of provider rules. Every example stays commented by default.
#
# For each traffic class, choose exactly one source form:
#   1. Relative file (recommended): installed beside the active profile.
#   2. Loopback URL: requires a separate HTTP server on the device running Surge.
#      `localhost` may be used instead of `127.0.0.1`; on iOS it means the iOS
#      device, not a Mac on the same network.
#   3. Remote URL: replace rules.example.com with your own HTTPS host.
[Rule]

# LAN and private-network traffic.
# RULE-SET,rules/lan.list,LAN Network
# RULE-SET,http://127.0.0.1:8080/rules/lan.list,LAN Network,update-interval=86400
# RULE-SET,https://rules.example.com/surge/lan.list,LAN Network,update-interval=86400

# Traffic that should prefer a LAN SOCKS exit.
# RULE-SET,rules/lan-socks.list,LAN PROXY
# RULE-SET,http://127.0.0.1:8080/rules/lan-socks.list,LAN PROXY,update-interval=86400
# RULE-SET,https://rules.example.com/surge/lan-socks.list,LAN PROXY,update-interval=86400

# Other destinations that should default to direct routing.
# RULE-SET,rules/other-direct.list,Other Direct
# RULE-SET,http://127.0.0.1:8080/rules/other-direct.list,Other Direct,update-interval=86400
# RULE-SET,https://rules.example.com/surge/other-direct.list,Other Direct,update-interval=86400
