# Local priority rules merged into the active Surge profile's [Rule] section.
#
# `shine app install surge` copies this file next to your profile; the overlay's
# build.sh appends `, local-rules.conf` to the [Rule] `#!include` line so these
# run ahead of the provider rules. Keep it empty by default and override it from
# a presets overlay when you need local priority rules.
#
# Examples:
[Rule]
# DOMAIN,smtp.gmail.com,LAN-SOCKS
# DOMAIN-SUFFIX,example.internal,DIRECT
# IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
