# Local proxy groups merged into the active Surge profile's [Proxy Group] section.
#
# `shine app install surge` copies this file next to your profile; the overlay's
# build.sh appends `, local-proxy-groups.conf` to the [Proxy Group] `#!include`
# line so Surge loads these after the provider groups. Keep it empty by default
# and override it from a presets overlay when you need local policy groups.
#
# Example:
[Proxy Group]
# Local Network = select, DIRECT, Proxies, include-all-proxies=true
