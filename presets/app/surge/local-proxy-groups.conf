# Local proxy groups merged into the active Surge profile's [Proxy Group] section.
#
# `shine app install surge` copies this file next to your profile; the built-in
# build.ts appends `, local-proxy-groups.conf` to the [Proxy Group] `#!include`
# line so Surge loads these after the provider groups. Keep it empty by default
# and override it from a presets overlay when you need local policy groups.
#
[Proxy Group]
Subscription = select, DIRECT, policy-path=subscription-proxies.conf, external-policy-name-prefix="SUB · "

# Other groups can import every generated subscription node:
# Main Proxy = select, DIRECT, include-other-group=Subscription
#
# Example local-only group:
# Local Network = select, DIRECT, Proxies, include-all-proxies=true
