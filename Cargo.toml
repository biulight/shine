[workspace]
members = ["core"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "2.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Felix Jiang <biulight007@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
anyhow = "1.0.102"
directories = "6.0.0"
toml = "1.1.2"
toml_edit = "0.25.11"
shine-core = { path = "core", version = "2.5.0" }

[package]
name = "shine-cli"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Give personal automation a reviewable lifecycle"
readme = "README.md"
repository = "https://github.com/biulight/shine"
homepage = "https://github.com/biulight/shine"
keywords = ["cli", "environment", "configuration", "bootstrap", "shell"]
categories = ["command-line-utilities", "config"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "cli/build.rs",
    "cli/src/**",
    "presets/**",
    "skills/**",
]
build = "cli/build.rs"

[lib]
name = "cli"
path = "cli/src/lib.rs"

[[bin]]
name = "shine"
path = "cli/src/main.rs"

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-darwin-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-darwin-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-windows-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/shine-v{ version }-windows-aarch64.tar.gz"

[dependencies]
shine-core = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
bech32 = "0.9.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
console = "0.16.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
directories = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "fs", "process", "sync", "signal", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
owo-colors = { version = "4", features = ["supports-colors"] }
similar = "3.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "socks"] }
semver = "1.0.28"
serde_json = "1.0.145"
flate2 = "1.1.4"
tar = "0.4.44"
glob = "0.3"
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
sha2 = "0.10.9"
zeroize = "1.8"
chacha20poly1305 = "0.10.1"
getrandom = "0.2"
fs2 = "0.4"
unicode-normalization = "0.1.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
