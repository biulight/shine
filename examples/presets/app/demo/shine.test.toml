[cases.host]
environment = ["DEMO_OPTION"]
secret_versions = { DEMO_TOKEN = "fixture-v1" }

[[cases.host.files]]
base = "home"
path = ".config/shine-demo/config.toml"
content = "enabled = true\n"

[cases.host.receipts]
app = '''
schema_version = 1

[[entries]]
source = "app/demo/config.toml"
destination = "${HOME}/.config/shine-demo/config.toml"
