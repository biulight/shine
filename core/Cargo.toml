[package]
name = "shine-core"
version.workspace = true
edition = "2024"
rust-version = "1.90"
license.workspace = true
description = "Reusable lifecycle runtime and domain core for Shine applications"
readme = "README.md"
repository = "https://github.com/biulight/shine"
homepage = "https://github.com/biulight/shine"
keywords = ["configuration", "toml", "presets"]
categories = ["config"]

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
flate2 = "1.1.4"
jsonc-parser = { version = "=0.32.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.2.2"
sha2 = "0.10.9"
hmac = "0.12.1"
zeroize = "1.8"
unicode-normalization = "0.1"
similar = "3.1"
tar = "0.4.44"
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.23.1"
tree-sitter-language = "=0.1.9"
tree-sitter-typescript = "=0.23.2"
url = "2.5.8"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { version = "1.23.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
